<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <title>Meet</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Lobby -->
  <section id="lobby" class="lobby">
    <div class="lobby-card glass">
      <div class="logo" aria-hidden="true"></div>
      <h1>Meet</h1>
      <p class="mute">Private, peer-to-peer calls. No account. No install.</p>
      <video id="preview" autoplay playsinline muted></video>
      <input id="name" placeholder="Your name" autocomplete="name" maxlength="40">
      <button id="joinBtn" class="primary">Join call</button>
      <p class="mute small" id="roomLabel"></p>
    </div>
  </section>

  <!-- Call -->
  <section id="call" class="call" hidden>
    <div id="grid" class="grid"></div>

    <aside id="panel" class="panel glass" hidden>
      <div class="tabs">
        <button class="tab active" data-tab="notes">Notes</button>
        <button class="tab" data-tab="transcript">Transcript</button>
      </div>
      <textarea id="notes" placeholder="Shared notes. Everyone in the call sees them live."></textarea>
      <div id="transcript" class="transcript" hidden></div>
      <div class="panel-actions">
        <button id="summarizeBtn" class="pill">Summarize</button>
        <button id="exportBtn" class="pill">Export .md</button>
      </div>
    </aside>

    <div id="captionBar" class="caption glass" hidden></div>

    <nav class="dock glass" aria-label="Call controls">
      <button id="micBtn" class="ctl" title="Mute (M)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="camBtn" class="ctl" title="Camera (V)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></button>
      <button id="shareBtn" class="ctl" title="Share screen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M12 13V7M9 10l3-3 3 3"/></svg></button>
      <button id="ccBtn" class="ctl" title="Live captions">CC</button>
      <button id="panelBtn" class="ctl" title="Notes (N)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></button>
      <button id="linkBtn" class="ctl" title="Copy invite link"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
      <button id="leaveBtn" class="ctl leave" title="Leave">Leave</button>
    </nav>
    <div id="toast" class="toast glass" hidden></div>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
