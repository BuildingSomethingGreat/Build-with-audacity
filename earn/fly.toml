app = "earn-micro-books"   # change to a unique name
primary_region = "ord"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "books"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
